<style>
/* ==================== TOKENS ==================== */
:root {
  --bg: #0A0A0A;
  --surface: #111111;
  --placeholder: #1A1A1A;
  --text: #F5F5F7;
  --text-dim: #86868B;
  --text-hover: #CCCCCC;
  --nav-bg: rgba(10, 10, 10, 0.85);
  --nav-line: rgba(255, 255, 255, 0.06);
  --radius: 4px;
  --nav-h: 52px;
  --lb-bg: rgba(0, 0, 0, 0.96);
  --dur-fade: 200ms;
  --dur-med: 300ms;
  --dur-lb: 250ms;
}

/* ==================== BASE ==================== */
* { margin: 0; padding: 0; box-sizing: border-box; }

/* 预留滚动条槽：灯箱锁定滚动时页面不因滚动条消失而整体重排 */
html { scrollbar-gutter: stable; }

body {
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Helvetica Neue", "Noto Sans SC", sans-serif;
  background: var(--bg);
  color: var(--text);
  font-size: 15px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}

button { font-family: inherit; }

/* ==================== NAV ==================== */
.site-nav {
  position: sticky; top: 0; z-index: 100;
  background: var(--nav-bg);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--nav-line);
}
.nav-inner {
  height: var(--nav-h);
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 24px;
}
.nav-brand {
  font-size: 13px; font-weight: 500;
  color: var(--text); text-decoration: none;
  letter-spacing: 0.01em;
}
.nav-filters { display: flex; align-items: center; gap: 32px; }

.filter {
  background: none; border: none; cursor: pointer;
  font-size: 12px; font-weight: 400;
  color: var(--text-dim);
  padding: 4px 0;
  transition: color 200ms ease;
}
.filter:hover { color: var(--text-hover); }
.filter.active { color: var(--text); box-shadow: 0 1.5px 0 0 var(--text); }
.filter[aria-expanded="true"] { color: var(--text); }

.filter-toggle {
  display: none;
  background: none; border: none; cursor: pointer;
  font-size: 12px; color: var(--text-dim);
  padding: 4px 0;
  transition: color 200ms ease;
}
.filter-toggle:hover { color: var(--text-hover); }

/* ==================== ABOUT PANEL ==================== */
.about-panel {
  max-height: 0; overflow: hidden;
  background: var(--surface);
  transition: max-height var(--dur-med) ease;
}
.about-panel.open { max-height: 160px; }
.about-panel p {
  height: 140px;
  display: flex; align-items: center; justify-content: center;
  padding: 0 24px;
  font-size: 13px; color: var(--text-dim);
}

/* ==================== MOBILE FILTER PANEL ==================== */
.mobile-panel { display: none; }

/* ==================== GALLERY ==================== */
.gallery-wrap {
  padding: 24px 24px 80px;
  min-height: 60vh;
}
.gallery { columns: 4; column-gap: 12px; }
.g-item {
  break-inside: avoid;
  margin-bottom: 12px;
  background: var(--placeholder);
  cursor: pointer;
}
.g-item img {
  width: 100%; height: auto; display: block;
  border-radius: 0;
  opacity: 0;
  transition: opacity var(--dur-fade) ease, filter var(--dur-med) ease-out;
}
.g-item img.loaded { opacity: 1; }
.g-item:hover img { filter: brightness(1.08); }

.empty {
  text-align: center;
  padding: 72px 24px;
  font-size: 13px; color: var(--text-dim);
}

/* ==================== LIGHTBOX ==================== */
.lightbox {
  position: fixed; inset: 0; z-index: 200;
  background: var(--lb-bg);
  display: flex; align-items: center; justify-content: center;
  opacity: 0; visibility: hidden;
  transition: opacity var(--dur-lb) ease-out, visibility 0s var(--dur-lb);
}
.lightbox.open {
  opacity: 1; visibility: visible;
  transition: opacity var(--dur-lb) ease-out;
}
.lb-img {
  max-width: 90vw; max-height: 85vh;
  object-fit: contain;
  transform: scale(0.96);
  transition: transform var(--dur-lb) ease-out;
  user-select: none;
  -webkit-user-drag: none;
}
.lightbox.open .lb-img { transform: scale(1); }

.lb-close {
  position: absolute; top: 20px; right: 20px;
  width: 36px; height: 36px; border-radius: var(--radius);
  background: rgba(255, 255, 255, 0.08); border: none; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  color: rgba(255, 255, 255, 0.5);
  transition: color 200ms ease, background 200ms ease;
}
.lb-close:hover { color: #FFFFFF; background: rgba(255, 255, 255, 0.14); }
.lb-close svg { width: 14px; height: 14px; }

.lb-arrow {
  position: absolute; top: 50%; transform: translateY(-50%);
  width: 40px; height: 40px; border-radius: var(--radius);
  background: rgba(255, 255, 255, 0.08); border: none; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  color: rgba(255, 255, 255, 0.5);
  opacity: 0; pointer-events: none;
  transition: opacity 200ms ease, color 200ms ease, background 200ms ease;
}
.lb-arrow:hover { color: #FFFFFF; background: rgba(255, 255, 255, 0.14); }
.lb-arrow svg { width: 18px; height: 18px; }
.lb-prev { left: 20px; }
.lb-next { right: 20px; }
.lightbox:hover .lb-arrow { opacity: 1; pointer-events: auto; }

@media (hover: none) {
  .lb-arrow { opacity: 0.6; pointer-events: auto; }
}

/* ==================== RESPONSIVE ==================== */
@media (max-width: 1024px) {
  .gallery { columns: 3; column-gap: 10px; }
  .g-item { margin-bottom: 10px; }
}

@media (max-width: 768px) {
  .nav-inner { padding: 0 16px; }
  .nav-filters { display: none; }
  .filter-toggle { display: block; }

  .mobile-panel {
    display: block;
    max-height: 0; overflow: hidden;
    background: var(--surface);
    border-radius: var(--radius);
    transition: max-height var(--dur-med) ease;
  }
  .mobile-panel.open { max-height: 320px; }
  .mobile-panel .filter {
    display: block; width: 100%;
    text-align: left;
    padding: 12px 20px;
    font-size: 13px;
  }
  .mobile-panel .filter.active { box-shadow: none; color: var(--text); }

  .gallery { columns: 2; column-gap: 8px; }
  .g-item { margin-bottom: 8px; }
  .gallery-wrap { padding: 16px 16px 64px; }
}

@media (max-width: 480px) {
  .gallery { columns: 1; }
}

/* ==================== REDUCED MOTION ==================== */
@media (prefers-reduced-motion: reduce) {
  *, ::before, ::after {
    transition-duration: 0.01ms !important;
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
  }
  .lb-img { transform: none; }
}
</style>

  { id: 96, src: 'images/full/船2.jpg', thumb: 'images/thumb/船2.jpg', category: "street" },
  { id: 97, src: 'images/full/船3.jpg', thumb: 'images/thumb/船3.jpg', category: "street" },
  { id: 98, src: 'images/full/船4.jpg', thumb: 'images/thumb/船4.jpg', category: "street" },
  { id: 99, src: 'images/full/船5.jpg', thumb: 'images/thumb/船5.jpg', category: "street" },
  { id: 100, src: 'images/full/船6.jpg', thumb: 'images/thumb/船6.jpg', category: "street" },
  { id: 101, src: 'images/full/邮便.jpg', thumb: 'images/thumb/邮便.jpg', category: "street" },
];

const CATEGORY_ALTS = { nature: '自然', arch: '建筑', rail: '铁道', street: '人文' };

// ============================================
//  状态
// ============================================
const gallery = document.getElementById('gallery');
const emptyState = document.getElementById('emptyState');
const navFilters = document.getElementById('navFilters');
const mobilePanel = document.getElementById('mobilePanel');
const filterToggle = document.getElementById('filterToggle');
const aboutPanel = document.getElementById('aboutPanel');
const lightbox = document.getElementById('lightbox');
const lbImg = document.getElementById('lbImg');

let currentCat = 'all';
let aboutOpen = false;
let filtered = [...PHOTOS];
let lbIndex = -1;
let lbSeq = 0; // 大图加载令牌

const SWIPE_X = 50;
const SWIPE_Y = 80;

// ============================================
//  ② 渲染模块 — 瞬间置换，无过渡动画
// ============================================
function renderGallery(cat) {
  gallery.innerHTML = '';
  filtered = cat === 'all' ? [...PHOTOS] : PHOTOS.filter(p => {
    const cats = Array.isArray(p.category) ? p.category : [p.category];
    return cats.includes(cat);
  });

  if (filtered.length === 0) {
    emptyState.hidden = false;
    return;
  }
  emptyState.hidden = true;

  filtered.forEach((photo, index) => {
    const item = document.createElement('div');
    item.className = 'g-item';
    item.addEventListener('click', () => openLightbox(index));

    const img = document.createElement('img');
    img.src = photo.thumb;
    const cat = Array.isArray(photo.category) ? photo.category[0] : photo.category;
    img.alt = CATEGORY_ALTS[cat] || '';
    img.loading = 'lazy';
    img.decoding = 'async';
    // 从 thumb URL 解析宽高，预留比例空间
    const dim = photo.thumb.match(/(\d+)\/(\d+)$/);
    if (dim) { img.width = dim[1]; img.height = dim[2]; }

    img.addEventListener('load', () => img.classList.add('loaded'));
    img.addEventListener('error', () => { /* 保持未 loaded，显示占位底色 */ });
    if (img.complete && img.naturalWidth > 0) img.classList.add('loaded');

    item.appendChild(img);
    gallery.appendChild(item);
  });
}

// ============================================
//  ③ 筛选模块 — 桌面/移动两套 DOM 同一委托
// ============================================
function syncActive() {
  document.querySelectorAll('.filter[data-cat]').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.cat === currentCat);
  });
}

function handleFilterClick(e) {
  const btn = e.target.closest('button[data-cat]');
  if (!btn) return;
  const cat = btn.dataset.cat;

  if (cat === 'about') {
    closeMobilePanel();
    toggleAbout();
    return;
  }
  if (cat === currentCat) {
    closeMobilePanel();
    return;
  }
  if (aboutOpen) toggleAbout(false);
  currentCat = cat;
  syncActive();
  if (lightbox.classList.contains('open')) closeLightbox();
  renderGallery(cat);
  closeMobilePanel();
}

navFilters.addEventListener('click', handleFilterClick);
mobilePanel.addEventListener('click', handleFilterClick);

// ============================================
//  ④ 关于面板模块
// ============================================
function toggleAbout(force) {
  aboutOpen = force !== undefined ? force : !aboutOpen;
  aboutPanel.classList.toggle('open', aboutOpen);
  document.querySelectorAll('.filter[data-cat="about"]').forEach(btn => {
    btn.setAttribute('aria-expanded', String(aboutOpen));
  });
}

// ============================================
//  移动端筛选下拉
// ============================================
function closeMobilePanel() {
  mobilePanel.classList.remove('open');
  filterToggle.setAttribute('aria-expanded', 'false');
}

filterToggle.addEventListener('click', () => {
  const open = mobilePanel.classList.toggle('open');
  filterToggle.setAttribute('aria-expanded', String(open));
});

// 点击导航区域外：收起关于面板与移动下拉
document.addEventListener('click', (e) => {
  if (!e.target.closest('.site-nav')) {
    if (aboutOpen) toggleAbout(false);
    closeMobilePanel();
  }
});

// ============================================
//  ⑤ 灯箱模块
// ============================================
// 先用缩略图即时出图，全尺寸在后台上载完成后自动替换
function showLightboxPhoto(photo) {
  const seq = ++lbSeq;
  const cat = Array.isArray(photo.category) ? photo.category[0] : photo.category;
  lbImg.alt = CATEGORY_ALTS[cat] || '';
  lbImg.src = photo.thumb;
  const full = new Image();
  full.decoding = 'async';
  full.onload = () => { if (seq === lbSeq && lbIndex !== -1) lbImg.src = photo.src; };
  full.src = photo.src;
}

function openLightbox(index) {
  lbIndex = index;
  const photo = filtered[index];
  if (!photo) return;
  showLightboxPhoto(photo);
  lightbox.classList.add('open');
  lightbox.setAttribute('aria-hidden', 'false');
  document.body.style.overflow = 'hidden';
  document.addEventListener('keydown', handleLightboxKeys);
}

function closeLightbox() {
  lightbox.classList.remove('open');
  lightbox.setAttribute('aria-hidden', 'true');
  document.body.style.overflow = '';
  document.removeEventListener('keydown', handleLightboxKeys);
  lbIndex = -1;
  // 待淡出结束后再清空 src，避免下次打开闪旧图
  setTimeout(() => { if (lbIndex === -1) lbImg.removeAttribute('src'); }, 260);
}

function navigateLightbox(direction) {
  if (filtered.length === 0 || lbIndex === -1) return;
  lbIndex = (lbIndex + direction + filtered.length) % filtered.length;
  showLightboxPhoto(filtered[lbIndex]);
}

document.getElementById('lbClose').addEventListener('click', closeLightbox);
document.getElementById('lbPrev').addEventListener('click', () => navigateLightbox(-1));
document.getElementById('lbNext').addEventListener('click', () => navigateLightbox(1));

lightbox.addEventListener('click', (e) => {
  if (e.target === lightbox) closeLightbox();
});

function handleLightboxKeys(e) {
  switch (e.key) {
    case 'Escape': closeLightbox(); break;
    case 'ArrowLeft': e.preventDefault(); navigateLightbox(-1); break;
    case 'ArrowRight': e.preventDefault(); navigateLightbox(1); break;
  }
}

// 触屏滑动翻页：水平位移 > 50px 且垂直位移 < 80px
let touchStartX = 0;
let touchStartY = 0;
lightbox.addEventListener('touchstart', (e) => {
  touchStartX = e.changedTouches[0].screenX;
  touchStartY = e.changedTouches[0].screenY;
}, { passive: true });
lightbox.addEventListener('touchend', (e) => {
  const diffX = touchStartX - e.changedTouches[0].screenX;
  const diffY = touchStartY - e.changedTouches[0].screenY;
  if (Math.abs(diffX) > SWIPE_X && Math.abs(diffY) < SWIPE_Y) {
    navigateLightbox(diffX > 0 ? 1 : -1);
  }
}, { passive: true });

// ============================================
//  ⑥ 断点状态清理 — 跨越 768px 时收起移动下拉
// ============================================
const mobileMq = window.matchMedia('(max-width: 768px)');
mobileMq.addEventListener('change', closeMobilePanel);

// ============================================
//  ⑦ 大图预载 — 页面空闲时提前拉取全尺寸图
// ============================================
window.addEventListener('load', () => {
  const idle = window.requestIdleCallback || ((cb) => setTimeout(cb, 500));
  idle(() => {
    PHOTOS.forEach(p => { const img = new Image(); img.src = p.src; });
  });
});

// ============================================
//  INIT
// ============================================
syncActive();
renderGallery(currentCat);
</script>

</body>
</html>
